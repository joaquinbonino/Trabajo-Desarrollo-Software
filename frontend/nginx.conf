server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA: cualquier ruta que no sea un archivo existente se
    # resuelve sirviendo index.html, para que React Router maneje el ruteo
    # del lado del cliente (evita el 404 al refrescar o entrar directo a
    # una ruta como /events/1 o /mis-entradas).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
